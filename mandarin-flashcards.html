<script>
const cards = JSON.parse(document.getElementById('cards').textContent);
const titles = ['วัน เดือน ปี อายุ และวันเกิด','ครอบครัว จำนวนคน และอาชีพ','สถานที่และแผนหลังเลิกเรียน','ที่พัก เลขห้อง และเบอร์โทรศัพท์','เวลาและกิจวัตรประจำวัน'];
const el = Object.fromEntries(Array.from(document.querySelectorAll('[id]'), node => [node.id,node]));
for(const [i,title] of titles.entries()) el.lesson.add(new Option('บท '+(6+i)+' · '+title,6+i));
el.lesson.add(new Option('รวมทุกบท','all'));
let deck = [], index = 0, revealed = false;
function render(){
 const c=deck[index];
 el.han.textContent=c.zh;
 el.pin.textContent=revealed?c.py:'';
 el.answer.textContent=revealed?c.th:'';
 el.note.textContent=revealed?(c.note||''):'';
 el.tag.textContent='บท '+c.lesson+' · '+(c.kind==='word'?'คำศัพท์':'ทบทวนก่อนสอบ');
 el.count.textContent=(index+1)+' / '+deck.length;
 el.card.classList.toggle('revealed',revealed);
 el.card.setAttribute('aria-pressed',String(revealed));
 el.hint.textContent=revealed?'แตะเพื่อกลับด้านหน้า':'แตะบัตรเพื่อดูพินอินและคำแปล';
 el.progress.style.width=(index+1)*100/deck.length+'%';
 el.prev.disabled=index===0;
 el.next.textContent=index===deck.length-1?'เริ่มรอบใหม่ ↻':'ถัดไป →';
}
function reset(){index=0;revealed=false;render()}
function filterCards(){
 deck=cards.filter(c=>(el.lesson.value==='all'||String(c.lesson)===el.lesson.value)&&(el.kind.value==='all'||c.kind===el.kind.value));
 reset();
}
el.lesson.onchange=el.kind.onchange=filterCards;
el.card.onclick=()=>{revealed=!revealed;render()};
el.prev.onclick=()=>{index=Math.max(index-1,0);revealed=false;render()};
el.next.onclick=()=>{index=(index+1)%deck.length;revealed=false;render()};
el.shuffle.onclick=()=>{
 for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 reset();
};
filterCards();
</script></html>
